apiVersion: v1
kind: Namespace
metadata:
  name: ovh-health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovh-health-a
  namespace: ovh-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovh-health
      instance: api-a
  template:
    metadata:
      labels:
        app: ovh-health
        instance: api-a
    spec:
      containers:
        - name: api
          image: ghcr.io/mehmetaesen/ovhhealthcheck.api@sha256:49a0f768171c7f3963afc752a70716eceb2c8f66ea79dacd1dfe198c3c95b270
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovh-health-b
  namespace: ovh-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovh-health
      instance: api-b
  template:
    metadata:
      labels:
        app: ovh-health
        instance: api-b
    spec:
      containers:
        - name: api
          image: ghcr.io/mehmetaesen/ovhhealthcheck.api@sha256:49a0f768171c7f3963afc752a70716eceb2c8f66ea79dacd1dfe198c3c95b270
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ovh-health
  namespace: ovh-health
spec:
  selector:
    app: ovh-health
  ports:
    - port: 80
      targetPort: http
